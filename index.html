<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FinTrack Pro — Professional expense tracking, budgeting, and financial analytics" />
  <meta name="theme-color" content="#0a0f1e" />

  <title>FinTrack Pro — Expense Tracker</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts: Inter (Non-blocking with local system font fallback for offline resilience) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </noscript>

  <style>
    /* ── Reset & Global ─────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      /* Core palette */
      --bg-primary:    #0a0f1e;
      --bg-secondary:  #111827;
      --bg-card:       #1a1f35;
      --bg-elevated:   #232a42;
      --border:        rgba(255, 255, 255, 0.06);
      --border-active: rgba(99, 102, 241, 0.5);

      /* Text */
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted:     #64748b;

      /* Accent */
      --accent:         #6366f1;
      --accent-light:   #818cf8;
      --accent-glow:    rgba(99, 102, 241, 0.25);

      /* Status */
      --success:  #22c55e;
      --warning:  #f59e0b;
      --danger:   #ef4444;
      --info:     #3b82f6;

      /* Spacing */
      --sidebar-w: 260px;
      --topbar-h:  64px;
      --radius:    12px;
      --radius-sm: 8px;
    }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* ── App Layout ─────────────────────────────────────────── */
    #app-wrapper {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg-secondary);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
    }

    /* Main area */
    #main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    /* Topbar */
    #topbar {
      height: var(--topbar-h);
      min-height: var(--topbar-h);
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 24px;
      gap: 16px;
    }

    /* Content area */
    #app-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      scroll-behavior: smooth;
    }

    /* Scrollbar styling */
    #app-content::-webkit-scrollbar { width: 6px; }
    #app-content::-webkit-scrollbar-track { background: transparent; }
    #app-content::-webkit-scrollbar-thumb {
      background: var(--bg-elevated);
      border-radius: 3px;
    }
    #app-content::-webkit-scrollbar-thumb:hover {
      background: var(--text-muted);
    }

    /* ── Loading State ──────────────────────────────────────── */
    .app-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      opacity: 0.5;
    }

    .app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ── Responsive ─────────────────────────────────────────── */
    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        left: 0; top: 0; bottom: 0;
        transform: translateX(-100%);
      }
      #sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div id="app-wrapper">
    <aside id="sidebar"><!-- filled by sidebar module --></aside>
    <div id="main-area">
      <header id="topbar"><!-- filled by topbar module --></header>
      <main id="app-content">
        <div class="app-loading">
          <div class="spinner"></div>
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
